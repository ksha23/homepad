<script data-rh="true" type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Lemony White Bean Soup With Turkey and Greens","description":"This soup is a weeknight staple &amp; freezes well.","author":[{"@type":"Person","name":"Jo Lee"},{"@type":"Person","name":"Ana Ruiz"}],"image":[{"@type":"ImageObject","url":"https://static.example/images/2026/01/soup-articleLarge.jpg","height":400,"width":600},{"@type":"ImageObject","url":"https://static.example/images/2026/01/soup-threeByTwoMediumAt2X.jpg","height":1000,"width":1500},{"@type":"ImageObject","url":"https://static.example/images/2026/01/soup-thumbStandard.jpg","height":75,"width":75}],"recipeYield":"4 to 6 servings","totalTime":"PT1H15M","cookTime":"PT1H","recipeCuisine":"","recipeCategory":"soups, dinner","keywords":"beans, greens, soup","recipeIngredient":["2 tablespoons extra-virgin olive oil","1 large onion, diced","1 pound ground turkey","2 (15-ounce) cans white beans, rinsed","6 cups chicken stock","1 bunch kale, stems removed and leaves torn","1 lemon, zested and juiced"],"recipeInstructions":[{"@type":"HowToStep","name":"Heat the oil in a large pot over medium-high. Add the onion","text":"Heat the oil in a large pot over medium-high. Add the onion and cook until it&#8217;s golden, 5 to 7 minutes."},{"@type":"HowToStep","text":"Add the turkey and cook, breaking it up, until browned, about 8 minutes. See our <a href=\"https://cooking.example/guides/browning\">browning guide</a>."},{"@type":"HowToStep","text":"Add the beans and stock, bring to a boil, then simmer 20 minutes."},{"@type":"HowToStep","text":"Stir in the kale and lemon zest and juice; cook until wilted, 3 to 5 minutes. Season to taste."}]}</script>
